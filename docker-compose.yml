version: '3.8'

services:
  app:
    image: evershop/evershop:latest
    container_name: evershop-app
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-postgresPass2026}
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-evershop}
    networks:
      - myevershop
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "80:3000"
      - "3000:3000"
  
  # The postgres database: 
  database:
    image: postgres:16-alpine
    container_name: evershop-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgresPass2026}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-evershop}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-evershop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myevershop

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
